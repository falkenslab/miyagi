# A release's files, built and checked here instead of on the maintainer's computer (#115).
# Pushing a vX.Y.Z tag builds miyagi.tgz (Ubuntu) and the desktop app on each system (#116):
# miyagi-setup.exe on Windows, miyagi-arm64.dmg and miyagi-x64.dmg on macOS, miyagi.AppImage and
# miyagi.deb on Linux. The Claude SDK installs only the claude binary of the platform npm runs on,
# so each installer is built on its own system. It checks them with the release skill's scripts and
# leaves a DRAFT release with them: the maintainer rewrites its notes and publishes it, and only
# then is it "latest", so the install links never point at a release without its files. Run by hand
# (workflow_dispatch), it builds and checks the files and keeps them as the run's artifacts,
# creating no release.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        name: The tag, package.json and desktop/package.json say the same version
        run: |
          version=$(node -p "require('./package.json').version")
          desktop=$(node -p "require('./desktop/package.json').version")
          echo "package.json $version, desktop/package.json $desktop, ref $GITHUB_REF_NAME"
          if [ "$desktop" != "$version" ]; then echo "::error::desktop/package.json is $desktop, package.json $version"; exit 1; fi
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then echo "::error::tag $GITHUB_REF_NAME but package.json is $version"; exit 1; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  package:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The gate of verify.yml that needs neither Claude nor Chrome.
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - run: node .claude/skills/verify/check-prompts.mjs
      - run: node .claude/skills/verify/check-references.mjs
      - run: node .claude/skills/verify/check-neutral-skills.mjs
      - run: node .claude/skills/verify/check-activity-register.mjs
      - run: node .claude/skills/verify/check-validators.mjs
      - run: node .claude/skills/verify/check-drafts-toolbox.mjs
      - run: node .claude/skills/verify/check-file-scope.mjs
      - run: node .claude/skills/verify/check-host.mjs
      - run: node .claude/skills/verify/check-tips.mjs
      - run: node .claude/skills/update-docs/check-docs.mjs
      - name: npm pack, as miyagi.tgz
        run: |
          mkdir -p out
          npm pack --pack-destination out
          mv "out/miyagi-${{ needs.version.outputs.version }}.tgz" out/miyagi.tgz
      - run: node .claude/skills/release/check-package.mjs out/miyagi.tgz ${{ needs.version.outputs.version }}
      - uses: actions/upload-artifact@v4
        with:
          name: miyagi.tgz
          path: out/miyagi.tgz
          if-no-files-found: error

  desktop:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            unpacked: desktop/dist/win-unpacked
            files: desktop/dist/miyagi-setup.exe
          - name: mac-arm64
            os: macos-latest
            unpacked: desktop/dist/mac-arm64
            files: desktop/dist/miyagi-arm64.dmg
          - name: mac-x64
            os: macos-15-intel
            unpacked: desktop/dist/mac
            files: desktop/dist/miyagi-x64.dmg
          - name: linux
            os: ubuntu-latest
            unpacked: desktop/dist/linux-unpacked
            files: |
              desktop/dist/miyagi.AppImage
              desktop/dist/miyagi.deb
            # No screen on the runner: a virtual one for the start check.
            display: xvfb-run -a
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # desktop/ has no lockfile in git: build.mjs writes miyagi's dependencies into its
      # package.json and installs them, as on the maintainer's computer.
      - name: Electron and electron-builder
        working-directory: desktop
        run: npm install --no-audit --no-fund
      - name: miyagi built and copied into the app, its dependencies installed
        working-directory: desktop
        run: npm run build
      - name: The installer of this system
        working-directory: desktop
        run: npm run dist
      - name: The unpacked app, and started until its rail shows the version
        run: ${{ matrix.display }} node .claude/skills/release/check-desktop.mjs ${{ matrix.unpacked }} ${{ needs.version.outputs.version }} desktop/dist/start-${{ matrix.name }}.png
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.name }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshot-${{ matrix.name }}
          path: desktop/dist/start-${{ matrix.name }}.png
          if-no-files-found: ignore

  release:
    needs: [version, package, desktop]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The package and every installer; the screenshots stay in the run.
      - uses: actions/download-artifact@v4
        with:
          path: out
          pattern: "{miyagi.tgz,desktop-*}"
          merge-multiple: true
      - run: ls -la out
      - name: Draft notes from the commits since the previous tag
        run: |
          previous=$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)
          latest=https://github.com/falkenslab/miyagi/releases/latest/download
          {
            echo "<!-- Borrador hecho por el workflow: reescríbelo para el profesorado (novedades, correcciones, cambios en las asignaturas) y publica. -->"
            echo
            echo "## Instalar"
            echo
            echo "- **Windows:** [miyagi-setup.exe]($latest/miyagi-setup.exe). No está firmado: la primera vez, «Más información» → «Ejecutar de todas formas»."
            echo "- **Mac:** [miyagi-arm64.dmg]($latest/miyagi-arm64.dmg) (Apple Silicon) o [miyagi-x64.dmg]($latest/miyagi-x64.dmg) (Intel). No está firmada: la primera vez, clic derecho › Abrir."
            echo "- **Linux:** [miyagi.AppImage]($latest/miyagi.AppImage) o [miyagi.deb]($latest/miyagi.deb)."
            echo "- **Terminal, en cualquier sistema:** \`npm install -g $latest/miyagi.tgz\`"
            echo
            echo "## Commits${previous:+ desde $previous}"
            echo
            git log --format='- %s' ${previous:+"$previous..$TAG"}
            echo
            echo "Usa agent-kit $(node -p "require('./package.json').dependencies['@falkenslab/agent-kit']")."
          } > notes.md
          cat notes.md
      - name: A draft release with every file
        run: |
          if state=$(gh release view "$TAG" --json isDraft -q .isDraft 2>/dev/null); then
            # A re-run: replace the files of the draft, never those of a published release.
            if [ "$state" != "true" ]; then echo "::error::$TAG is already published"; exit 1; fi
            gh release upload "$TAG" out/* --clobber
          else
            gh release create "$TAG" out/* --draft --verify-tag --title "miyagi $TAG" --notes-file notes.md
          fi
          echo "Draft: $(gh release view "$TAG" --json url -q .url)" >> "$GITHUB_STEP_SUMMARY"
