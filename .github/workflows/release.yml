# A release's files, built and checked here instead of on the maintainer's computer (#115).
# Pushing a vX.Y.Z tag builds miyagi.tgz (Ubuntu) and miyagi-setup.exe (Windows: the SDK installs
# only the claude binary of the platform it runs on, so each installer is built on its own system),
# checks both with the release skill's scripts and leaves a DRAFT release with them: the maintainer
# rewrites its notes and publishes it, and only then is it "latest", so the install links never
# point at a release without its files. Run by hand (workflow_dispatch), it builds and checks the
# files and keeps them as the run's artifacts, creating no release.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        name: The tag, package.json and desktop/package.json say the same version
        run: |
          version=$(node -p "require('./package.json').version")
          desktop=$(node -p "require('./desktop/package.json').version")
          echo "package.json $version, desktop/package.json $desktop, ref $GITHUB_REF_NAME"
          if [ "$desktop" != "$version" ]; then echo "::error::desktop/package.json is $desktop, package.json $version"; exit 1; fi
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then echo "::error::tag $GITHUB_REF_NAME but package.json is $version"; exit 1; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  package:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The gate of verify.yml that needs neither Claude nor Chrome.
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - run: node .claude/skills/verify/check-prompts.mjs
      - run: node .claude/skills/verify/check-references.mjs
      - run: node .claude/skills/verify/check-neutral-skills.mjs
      - run: node .claude/skills/verify/check-activity-register.mjs
      - run: node .claude/skills/verify/check-validators.mjs
      - run: node .claude/skills/verify/check-drafts-toolbox.mjs
      - run: node .claude/skills/verify/check-file-scope.mjs
      - run: node .claude/skills/verify/check-host.mjs
      - run: node .claude/skills/verify/check-tips.mjs
      - run: node .claude/skills/update-docs/check-docs.mjs
      - name: npm pack, as miyagi.tgz
        run: |
          mkdir -p out
          npm pack --pack-destination out
          mv "out/miyagi-${{ needs.version.outputs.version }}.tgz" out/miyagi.tgz
      - run: node .claude/skills/release/check-package.mjs out/miyagi.tgz ${{ needs.version.outputs.version }}
      - uses: actions/upload-artifact@v4
        with:
          name: miyagi.tgz
          path: out/miyagi.tgz
          if-no-files-found: error

  desktop:
    needs: version
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      - run: npm ci
      - name: Electron and electron-builder
        working-directory: desktop
        run: npm ci
      - name: miyagi built and copied into the app, its dependencies installed
        working-directory: desktop
        run: npm run build
      - name: The installer
        working-directory: desktop
        run: npm run dist
      - name: The unpacked app, and started until its rail shows the version
        run: node .claude/skills/release/check-desktop.mjs desktop/dist/win-unpacked ${{ needs.version.outputs.version }} desktop/dist/start.png
      - uses: actions/upload-artifact@v4
        with:
          name: miyagi-setup.exe
          path: desktop/dist/miyagi-setup.exe
          if-no-files-found: error
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-screenshot
          path: desktop/dist/start.png
          if-no-files-found: ignore

  release:
    needs: [version, package, desktop]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Draft notes from the commits since the previous tag
        run: |
          previous=$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)
          {
            echo "<!-- Borrador hecho por el workflow: reescríbelo para el profesorado (novedades, correcciones, cambios en las asignaturas) y publica. -->"
            echo
            echo "## Instalar"
            echo
            echo "- **Windows:** descarga [miyagi-setup.exe](https://github.com/falkenslab/miyagi/releases/latest/download/miyagi-setup.exe) y ábrelo. No está firmado, así que Windows avisa la primera vez: «Más información» → «Ejecutar de todas formas»."
            echo "- **Mac, Linux o terminal:** \`npm install -g https://github.com/falkenslab/miyagi/releases/latest/download/miyagi.tgz\`"
            echo
            echo "## Commits${previous:+ desde $previous}"
            echo
            git log --format='- %s' ${previous:+"$previous..$TAG"}
            echo
            echo "Usa agent-kit $(node -p "require('./package.json').dependencies['@falkenslab/agent-kit']")."
          } > notes.md
          cat notes.md
      - name: A draft release with both files
        run: |
          if state=$(gh release view "$TAG" --json isDraft -q .isDraft 2>/dev/null); then
            # A re-run: replace the files of the draft, never those of a published release.
            if [ "$state" != "true" ]; then echo "::error::$TAG is already published"; exit 1; fi
            gh release upload "$TAG" out/miyagi.tgz out/miyagi-setup.exe --clobber
          else
            gh release create "$TAG" out/miyagi.tgz out/miyagi-setup.exe --draft --verify-tag --title "miyagi $TAG" --notes-file notes.md
          fi
          echo "Draft: $(gh release view "$TAG" --json url -q .url)" >> "$GITHUB_STEP_SUMMARY"
